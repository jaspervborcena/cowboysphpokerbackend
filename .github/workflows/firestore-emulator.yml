name: Firestore Emulator Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15

      - name: Install Firestore rules test dependencies
        run: npm ci

      - name: Run Firestore emulator integration tests
        run: >-
          firebase emulators:exec --only firestore
          --project demo-cowboys-ph-poker
          "python -m pytest tests/test_firestore_emulator.py tests/test_firestore_demo_seed.py -q && npm run test:firestore-rules"